<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card shadow p-5 rounded-4">
        

        <h2 class="fw-bold mb-4 text-center">

          Register Company

        </h2>

        <div class="mb-3">

          <label class="form-label">
            Company Name
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="companyName"
          >

        </div>

        <div class="mb-3">

          <label class="form-label">
            Company Code
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="companyCode"
          >

        </div>

        <div class="mb-3">

          <label class="form-label">
            Admin Name
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="adminName"
          >

        </div>

        <div class="mb-3">

          <label class="form-label">
            Admin Email
          </label>

          <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
          >

        </div>

        <div class="mb-4">

          <label class="form-label">
            Password
          </label>

          <input
            type="password"
            class="form-control"
            [(ngModel)]="password"
          >

        </div>

        <button
          class="btn btn-dark w-100"
          (click)="registerCompany()"
        >

          Create Workspace

        </button>

      </div>

    </div>

  </div>

</div>
