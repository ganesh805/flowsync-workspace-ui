<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg p-4 p-md-5 rounded-4 border-0 bg-surface">
        <h2 class="fw-bold mb-2 text-center text-main">Register Organization</h2>
        <p class="text-secondary text-center small mb-4">Set up a new company workspace as Organization Owner</p>

        <div class="mb-3">
          <label class="form-label text-secondary fs-xs fw-semibold">Company Name</label>
          <input
            type="text"
            class="form-control rounded-3"
            autocomplete="off"
            [(ngModel)]="companyName"
          >
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary fs-xs fw-semibold">Company Code</label>
          <input
            type="text"
            class="form-control rounded-3 font-monospace"
            autocomplete="off"
            [(ngModel)]="companyCode"
          >
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary fs-xs fw-semibold">Company Domain</label>
          <input
            type="text"
            class="form-control rounded-3 font-monospace"
            autocomplete="off"
            [(ngModel)]="companyDomain"
          >
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary fs-xs fw-semibold">Organization Owner Name</label>
          <input
            type="text"
            class="form-control rounded-3"
            autocomplete="off"
            [(ngModel)]="adminName"
          >
        </div>

        <div class="mb-3">
          <label class="form-label text-secondary fs-xs fw-semibold">Owner Email (@domain)</label>
          <input
            type="email"
            class="form-control rounded-3"
            autocomplete="off"
            [(ngModel)]="email"
          >
        </div>

        <div class="mb-4">
          <label class="form-label text-secondary fs-xs fw-semibold">Password</label>
          <input
            type="password"
            class="form-control rounded-3"
            autocomplete="new-password"
            [(ngModel)]="password"
          >
        </div>

        <button
          class="btn btn-primary btn-indigo text-white w-100 py-2.5 rounded-3 mb-3 fw-bold shadow-sm"
          (click)="registerCompany()"
          [disabled]="loading"
        >
          {{ loading ? 'Creating Workspace...' : 'Create Organization Workspace' }}
        </button>

        <div class="text-center">
          <a routerLink="/login" class="text-decoration-none small text-indigo fw-semibold">← Back to Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
