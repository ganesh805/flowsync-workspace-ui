<div class="toast-wrapper position-fixed top-0 end-0 p-3" style="z-index: 1100;">
  <div
    *ngFor="let toast of toastService.toasts()"
    class="toast show align-items-center text-white border-0 mb-2 shadow-lg glass-toast"
    [ngClass]="{
      'bg-success': toast.type === 'success',
      'bg-danger': toast.type === 'danger',
      'bg-primary': toast.type === 'info',
      'bg-warning text-dark': toast.type === 'warning'
    }"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">
        <strong class="d-block fw-bold mb-1">{{ toast.title }}</strong>
        <span>{{ toast.message }}</span>
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="toastService.remove(toast.id)"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
