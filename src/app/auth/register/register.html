<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow-lg p-5" style="width: 450px; border-radius: 20px;">
    <h2 class="text-center fw-bold mb-4">Create Account</h2>

    <div class="mb-3">
      <label class="form-label text-secondary fs-xs fw-semibold">Company Code</label>
      <input
        type="text"
        class="form-control"
        autocomplete="off"
        [(ngModel)]="companyCode"
      >
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary fs-xs fw-semibold">Full Name</label>
      <input
        type="text"
        class="form-control form-control-lg"
        autocomplete="off"
        [(ngModel)]="name"
      >
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary fs-xs fw-semibold">Username</label>
      <input
        type="text"
        class="form-control form-control-lg"
        autocomplete="off"
        [(ngModel)]="username"
      >
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary fs-xs fw-semibold">Designation</label>
      <input
        type="text"
        class="form-control form-control-lg"
        autocomplete="off"
        [(ngModel)]="designation"
      >
    </div>

    <div class="mb-3">
      <label class="form-label text-secondary fs-xs fw-semibold">Email Address</label>
      <input
        type="email"
        class="form-control form-control-lg"
        autocomplete="off"
        [(ngModel)]="email"
      >
    </div>

    <div class="mb-4">
      <label class="form-label text-secondary fs-xs fw-semibold">Password</label>
      <input
        type="password"
        class="form-control form-control-lg"
        autocomplete="new-password"
        [(ngModel)]="password"
      >
    </div>

    <button
      class="btn btn-indigo text-white btn-lg w-100 fw-bold shadow-sm"
      (click)="register()"
    >
      Register
    </button>

    <p class="text-center mt-3 mb-0">
      Already have an account?
      <a routerLink="/login" class="text-indigo text-decoration-none fw-semibold">Login</a>
    </p>
  </div>
</div>
